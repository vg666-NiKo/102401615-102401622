<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3b5fe4">
  <meta name="description" content="校园失物招领：集中发布、快速查找、温暖归还。">
  <title>校园失物招领</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232f74e6'/%3E%3Cstop offset='1' stop-color='%235b53e8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-size='36' font-family='sans-serif' font-weight='700' fill='white' text-anchor='middle'%3E%E5%AF%BB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/core.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/clipboard.js"></script>
  <script defer src="js/images.js"></script>
  <script defer src="js/recommendations.js"></script>
  <script defer src="js/pages/my-posts.js"></script>
  <script defer src="js/pages/search.js"></script>
  <script defer src="js/pages/detail.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="header">
      <div class="brand"><span class="brand-icon" aria-hidden="true">寻</span><span>校园失物招领</span></div>
      <h1>让失物更快<br>回到主人身边</h1>
      <p>集中发布 · 快速查找 · 温暖归还</p>
    </header>
    <main id="main-content" tabindex="-1">
      <p id="storage-warning" class="notice error-notice" role="alert" hidden></p>
      <p id="feedback" class="notice success-notice" role="status" hidden></p>
      <section id="home-page" class="page" aria-labelledby="home-title">
        <button class="search-entry" type="button" data-page="search"><span aria-hidden="true">⌕</span>搜索物品名称、地点…<span class="search-label">搜索</span></button>
        <div class="section-heading"><h2 id="home-title">校园最新信息</h2><span id="result-count" aria-live="polite"></span></div>
        <div class="filters" role="group" aria-label="信息类型筛选">
          <button type="button" class="filter active" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" class="filter" data-filter="lost" aria-pressed="false">寻物</button>
          <button type="button" class="filter" data-filter="found" aria-pressed="false">招领</button>
        </div>
        <div id="home-list" class="item-list"></div>
        <p id="home-limit-hint" class="field-hint" hidden></p>
        <p class="demo-note">初始 5 条为虚构演示信息；新增信息保存在当前浏览器。</p>
      </section>
      <section id="search-page" class="page" aria-labelledby="search-title" hidden>
        <h2 id="search-title">搜索物品</h2>
        <p class="form-intro">按物品名称、地点或描述查找线索。</p>
        <form id="search-form" class="search-form" role="search">
          <div class="field"><label for="search-keyword">关键词</label><div class="search-input-row"><input id="search-keyword" name="keyword" type="search" maxlength="100" placeholder="如：黑色 雨伞"><button type="submit" class="primary-button">搜索</button></div><p class="field-hint">多个关键词用空格分隔，结果需同时包含这些词。</p></div>
          <div class="search-options">
            <div class="field"><label for="search-type">信息类型</label><select id="search-type"><option value="all">全部</option><option value="lost">寻物</option><option value="found">招领</option></select></div>
            <div class="field"><label for="search-category">物品类别</label><select id="search-category"><option value="all">全部类别</option><option>证件</option><option>电子用品</option><option>生活用品</option><option>书籍文具</option><option>其他</option></select></div>
          </div>
          <div class="search-footer"><label class="checkbox-label"><input id="search-active" type="checkbox">仅看未完成</label><button type="button" id="search-reset" class="text-button">清空筛选</button></div>
        </form>
        <div class="section-heading"><h3 class="results-heading">搜索结果</h3><span id="search-count" aria-live="polite"></span></div>
        <div id="search-list" class="item-list"></div>
      </section>
      <section id="publish-page" class="page" aria-labelledby="publish-title" hidden>
        <h2 id="publish-title">发布信息</h2>
        <p class="form-intro">带 * 的内容为必填，清晰的描述有助于找回物品。</p>
        <form id="publish-form" class="publish-form" novalidate>
          <fieldset class="type-field"><legend>信息类型 *</legend>
            <label><input type="radio" name="type" value="lost" checked> 我要寻物</label>
            <label><input type="radio" name="type" value="found"> 我要招领</label>
          </fieldset>
          <div class="field"><label for="f-title">物品名称 *</label><input id="f-title" name="title" maxlength="40" placeholder="如：黑色雨伞" required><p id="error-title" class="field-error" hidden></p></div>
          <div class="field"><label for="f-category">物品类别 *</label><select id="f-category" name="category"><option>证件</option><option>电子用品</option><option>生活用品</option><option>书籍文具</option><option>其他</option></select></div>
          <div class="field"><label for="f-place">丢失／捡到地点 *</label><input id="f-place" name="place" maxlength="80" placeholder="如：图书馆三楼" required><p id="error-place" class="field-error" hidden></p></div>
          <div class="field"><label for="f-eventTime">丢失／捡到时间</label><input id="f-eventTime" name="eventTime" type="datetime-local"><p id="event-time-hint" class="field-hint">不填则使用发布时刻。</p><p id="error-eventTime" class="field-error" hidden></p></div>
          <div class="field"><label for="f-description">详细描述</label><textarea id="f-description" name="description" rows="4" maxlength="500" placeholder="物品的颜色、外观和特征（最多 500 字）"></textarea><p id="error-description" class="field-error" hidden></p></div>
          <div class="field"><label for="f-contact">联系方式 *</label><input id="f-contact" name="contact" maxlength="100" placeholder="微信号或手机号" required><p class="field-hint">联系方式将展示在详情中，请勿填写密码等敏感内容。</p><p id="error-contact" class="field-error" hidden></p></div>
          <div class="field"><label for="f-image">物品照片（选填）</label><input id="f-image" type="file" accept="image/jpeg,image/png,image/webp" aria-describedby="image-hint"><p id="image-hint" class="field-hint">支持 JPG、PNG、WebP，最大 5 MB。保存前自动缩小和压缩，透明背景转为白色。</p><div id="image-preview" class="upload-preview" hidden></div><button id="image-remove" type="button" class="secondary-button" hidden>移除照片</button><p id="image-feedback" class="field-hint" role="status"></p></div>
          <p id="publish-error" class="notice error-notice" role="alert" hidden></p>
          <button id="edit-cancel" class="secondary-button" type="button" hidden>取消编辑</button>
          <button id="publish-submit" class="primary-button submit-button" type="submit">发布信息</button>
        </form>
      </section>
      <section id="mine-page" class="page" aria-labelledby="mine-title" hidden>
        <h2 id="mine-title">我的发布</h2>
        <p class="form-intro">管理当前浏览器中由你发布的信息。</p>
        <div id="mine-summary" class="mine-stats" aria-label="我的发布统计"></div>
        <div class="filters" role="group" aria-label="我的发布状态筛选">
          <button type="button" class="filter active" data-mine-filter="all" aria-pressed="true">全部</button>
          <button type="button" class="filter" data-mine-filter="active" aria-pressed="false">进行中</button>
          <button type="button" class="filter" data-mine-filter="completed" aria-pressed="false">已完成</button>
        </div>
        <p id="mine-feedback" class="notice" role="status" hidden></p>
        <div id="mine-list" class="item-list"></div>
      </section>
      <section id="detail-page" class="page" aria-labelledby="detail-title" hidden>
        <button id="detail-back" type="button" class="back-button">← 返回列表</button>
        <h2 id="detail-title">物品详情</h2>
        <div id="detail-content"></div>
      </section>
    </main>
    <nav class="bottom-nav" aria-label="主要导航">
      <button type="button" class="nav-item active" data-page="home" aria-current="page"><span aria-hidden="true">⌂</span>首页</button>
      <button type="button" class="nav-item" data-page="search"><span aria-hidden="true">⌕</span>搜索</button>
      <button type="button" class="nav-item" data-page="publish"><span class="nav-plus" aria-hidden="true">＋</span>发布</button>
      <button type="button" class="nav-item" data-page="mine"><span aria-hidden="true">◇</span>我的</button>
    </nav>
  </div>
</body>
</html>
